[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "node_modules/nodemailer/lib/well-known/services.json"

# Compatibilité avec l'ancien formulaire PHP : le POST est envoyé à la fonction Netlify.
[[redirects]]
  from = "/php/send-sponsoring.php"
  to = "/.netlify/functions/send-sponsoring"
  status = 307

[[redirects]]
  from = "/sponsoring"
  to = "/sponsoring.html"
  status = 200

[[redirects]]
  from = "/merci"
  to = "/merci.html"
  status = 200
